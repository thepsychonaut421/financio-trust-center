# Keep bearer access-link paths and query strings out of ingress logs.
map $uri $trust_center_log_path {
    ~^/api/access/ /api/access/[redacted];
    ~^/access/ /access/[redacted];
    default $uri;
}
log_format trust_center_safe '$remote_addr [$time_local] "$request_method $trust_center_log_path $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    client_max_body_size 25m;
    access_log /dev/stdout trust_center_safe;

    location = /api/revalidate {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health {
        proxy_pass http://backend:4000;
    }
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}
