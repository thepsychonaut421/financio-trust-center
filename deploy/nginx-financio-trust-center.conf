# Include in nginx's http context (Debian sites-enabled is included there).
# Query strings and bearer link paths must not be written to access logs.
map $uri $trust_center_log_path {
    ~^/api/access/ /api/access/[redacted];
    ~^/access/ /access/[redacted];
    default $uri;
}
log_format trust_center_safe '$remote_addr [$time_local] "$request_method $trust_center_log_path $server_protocol" $status $body_bytes_sent';

server {
    listen 127.0.0.1:8080;
    server_name trust.financioflow.com;
    client_max_body_size 25m;
    access_log /var/log/nginx/financio-trust-center-access.log trust_center_safe;
    location /api/ {
        proxy_pass http://127.0.0.1:4101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health {
        proxy_pass http://127.0.0.1:4101;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
