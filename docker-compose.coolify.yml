# Source-build Coolify deployment; automation uses one separately configured scheduled task.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DEMO_MODE: 'false'
      SUPABASE_URL: ${SUPABASE_URL:?Dedicated Trust Center Supabase URL required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Dedicated Trust Center public anon key
        required}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?Dedicated Trust Center service
        key required}
      FRONTEND_URL: ${TRUST_CENTER_PUBLIC_URL:?Trust Center HTTPS URL required}
      BACKEND_PUBLIC_URL: ${TRUST_CENTER_PUBLIC_API_URL:?Trust Center public API URL
        required}
      UPLOADS_DIR: /app/uploads
      ALLOW_ADMIN_SIGNUP: 'false'
      ENABLE_TEST_EMAIL: 'false'
      DOCUMENT_UPLOADS_ENABLED: ${DOCUMENT_UPLOADS_ENABLED:-true}
      DOCUMENT_UPLOAD_ADMIN_EMAIL_ALLOWLIST: ${DOCUMENT_UPLOAD_ADMIN_EMAIL_ALLOWLIST:-}
      DOCUMENT_UPLOADS_PER_MINUTE: '20'
      DOCUMENT_UPLOAD_MAX_MB: '25'
      TRUST_CENTER_SOURCE_REPOSITORY: ${TRUST_CENTER_SOURCE_REPOSITORY:-thepsychonaut421/Financio-Flow-ERP}
      TRUST_CENTER_GITHUB_TOKEN: ${TRUST_CENTER_GITHUB_TOKEN:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Verified Trust Center sender required}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      TRUST_CENTER_AUTOMATION_ENABLED: ${TRUST_CENTER_AUTOMATION_ENABLED:-false}
      TRUST_CENTER_AUTOMATION_ACTOR_ID: ${TRUST_CENTER_AUTOMATION_ACTOR_ID:-}
      TRUST_CENTER_AUTOMATION_ACTOR_EMAIL: ${TRUST_CENTER_AUTOMATION_ACTOR_EMAIL:-}
    volumes:
    - trust-center-uploads:/app/uploads
    - automation-state:/var/lib/financio-trust-automation
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4000/api/documents',{signal:AbortSignal.timeout(5000)}).then(async
        r=>{if(!r.ok||!Array.isArray(await r.json()))process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    expose:
    - '4000'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Dedicated Trust Center
          public Supabase URL required}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Dedicated Trust Center
          public anon key required}
        NEXT_PUBLIC_API_URL: ${TRUST_CENTER_PUBLIC_API_URL:?Trust Center public API
          URL required}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      NEXT_PUBLIC_API_URL: ${TRUST_CENTER_PUBLIC_API_URL}
      API_URL: http://backend:4000
      TRUST_CENTER_PUBLIC_URL: ${TRUST_CENTER_PUBLIC_URL:?Trust Center HTTPS URL required}
      NEXT_PUBLIC_DEMO_MODE: 'false'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    expose:
    - '3000'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
  gateway:
    image: ${TRUST_CENTER_GATEWAY_IMAGE:?Pin the approved nginxinc/nginx-unprivileged
      image digest}
    expose:
    - '8080'
    volumes:
    - ./deploy/coolify/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/documents
      interval: 30s
      timeout: 8s
      start_period: 15s
      retries: 5
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
volumes:
  trust-center-uploads:
    external: true
    name: ${TRUST_CENTER_UPLOADS_VOLUME:?Use the restored and verified uploads volume}
  automation-state: {}
